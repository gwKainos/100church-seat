<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <?!= include('Styles'); ?>
  <style>
    body { overflow: hidden; touch-action: none; }
    .wrapper { display: flex; height: 100vh; }

    /* 사이드바 */
    .sidebar {
      width: 150px; background: #f8f9fa; border-right: 1px solid #ddd;
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: margin-left 0.3s; position: relative;
    }
    .sidebar.collapsed { margin-left: -150px; }
    .sidebar-toggle {
      position: absolute; top: 50%; right: -24px; transform: translateY(-50%);
      width: 24px; height: 56px; background: #333; color: #fff;
      border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 11px;
    }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-footer { padding: 8px; display: flex; flex-direction: column; gap: 4px; }

    .grade-row { display: flex; gap: 4px; margin-bottom: 8px; }
    .grade-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .choir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    /* 메인 영역 */
    .main { flex: 1; display: flex; flex-direction: column; padding: 8px; overflow: hidden; }
    .grid-area { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
    .grid { display: grid; gap: 2px; }
    .grid .cell { width: 24px; height: 24px; }

    /* 탭 색상 */
    .tab.active[data-layer="original"] { background: #28a745; }
    .tab.active[data-layer="moved"] { background: #007bff; }

    @media (orientation: portrait) {
      .wrapper { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; height: auto; border-right: none; border-bottom: 1px solid #ddd; }
      .sidebar.collapsed { margin-left: 0; margin-top: -120px; }
      .sidebar-toggle { top: auto; bottom: -24px; right: 8px; width: 48px; height: 24px; border-radius: 0 0 4px 4px; transform: none; }
      .sidebar-content { flex-direction: row; }
    }
  </style>
</head>
<body>

<div id="loading" class="loading-overlay">불러오는 중...</div>
<div id="alert" class="alert-banner" onclick="refresh()">데이터가 변경되었습니다 (클릭)</div>

<div class="wrapper">
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
    <div class="sidebar-content">
      <div class="grade-row">
        <div class="grade-col">
          <div class="label">5학년</div>
          <? var classes = getClassData(); ?>
          <? for (var i = 0; i < classes.grade5.length; i++) { ?>
          <div class="tag tag-5" onclick="selectTag(this)"><?= classes.grade5[i] ?></div>
          <? } ?>
        </div>
        <div class="grade-col">
          <div class="label">6학년</div>
          <? for (var j = 0; j < classes.grade6.length; j++) { ?>
          <div class="tag tag-6" onclick="selectTag(this)"><?= classes.grade6[j] ?></div>
          <? } ?>
        </div>
      </div>
      <div class="label">성가대</div>
      <div class="choir-grid">
        <? for (var k = 0; k < classes.choir.length; k++) { ?>
        <div class="tag tag-choir" onclick="selectTag(this)"><?= classes.choir[k] ?></div>
        <? } ?>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-success" onclick="save()">저장</button>
      <button class="btn btn-danger" onclick="reset()">리셋</button>
      <button class="btn btn-secondary" onclick="App.goTo('admin')">관리자</button>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab active" data-layer="moved" onclick="switchLayer('moved')">이동 자리</button>
      <button class="tab" data-layer="original" onclick="switchLayer('original')">원본 자리</button>
    </div>
    <div class="grid-area">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<?!= include('Utils'); ?>
<script>
var ROWS = 11, COLS = 32;
var currentLayer = 'moved';
var layouts = {};  // { original: config, moved: config }
var movedSeats = {};
var selected = { name: '', bg: '', color: '' };

function toggleSidebar() {
  var s = document.getElementById('sidebar');
  s.classList.toggle('collapsed');
  document.querySelector('.sidebar-toggle').innerText = s.classList.contains('collapsed') ? '▶' : '◀';
}

function selectTag(el) {
  if (currentLayer === 'original') return;
  document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('selected'); });

  if (selected.name === el.innerText) {
    selected = { name: '', bg: '', color: '' };
    return;
  }

  var style = getComputedStyle(el);
  selected = { name: el.innerText, bg: style.backgroundColor, color: style.color };
  el.classList.add('selected');
}

function switchLayer(layer) {
  currentLayer = layer;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.tab[data-layer="' + layer + '"]').classList.add('active');
  selected = { name: '', bg: '', color: '' };
  document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('selected'); });
  render();
}

function render() {
  var g = document.getElementById('grid');
  g.innerHTML = '';

  var config = layouts[currentLayer] || { rows: ROWS, aisles: [], pillars: [] };

  // 통로 Set 생성 (새 형식: [행,열] 또는 이전 형식: 열번호)
  var aisles = new Set();
  (config.aisles || []).forEach(function(p) {
    if (Array.isArray(p)) {
      aisles.add(p[0] + '_' + p[1]);
    } else {
      // 이전 형식: 전체 열
      for (var r = 1; r <= ROWS; r++) {
        aisles.add(r + '_' + p);
      }
    }
  });

  var pillars = new Set((config.pillars || []).map(function(p) { return p[0] + '_' + p[1]; }));

  // 그리드 열 수 = 32 (고정, 통로는 별도 셀이 아니라 같은 위치)
  g.style.gridTemplateColumns = 'repeat(' + COLS + ', 24px)';

  for (var r = 1; r <= ROWS; r++) {
    for (var c = 1; c <= COLS; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var key = r + '_' + c;

      if (aisles.has(key)) {
        cell.classList.add('cell-aisle');
      } else if (pillars.has(key)) {
        cell.classList.add('cell-pillar');
        cell.innerText = '기';
      } else {
        cell.dataset.key = key;
        if (currentLayer === 'moved') {
          cell.classList.add('cell-seat', 'cell-selectable');
          cell.onmousedown = function() { Drag.start(); paint(this); };
          cell.onmouseenter = function() { if (Drag.active) paint(this); };
          cell.ontouchstart = function() { Drag.start(); paint(this); };
        } else {
          cell.classList.add('cell-readonly');
        }
      }
      g.appendChild(cell);
    }
  }

  if (currentLayer === 'moved') applySeats();
}

function applySeats() {
  var tags = document.querySelectorAll('.tag');
  document.querySelectorAll('.cell-selectable').forEach(function(cell) {
    var name = movedSeats[cell.dataset.key];
    if (name) {
      cell.innerText = name;
      tags.forEach(function(t) {
        if (t.innerText === name) {
          var s = getComputedStyle(t);
          cell.style.backgroundColor = s.backgroundColor;
          cell.style.color = s.color;
        }
      });
    }
  });
}

function paint(cell) {
  if (currentLayer !== 'moved') return;
  if (selected.name) {
    cell.innerText = selected.name;
    cell.style.backgroundColor = selected.bg;
    cell.style.color = selected.color;
  } else {
    cell.innerText = '';
    cell.style.backgroundColor = '';
    cell.style.color = '';
  }
}

function save() {
  if (currentLayer !== 'moved') {
    alert('이동 자리 탭에서만 저장할 수 있습니다.');
    return;
  }
  App.showLoading('저장 중...');
  var data = {};
  document.querySelectorAll('.cell-selectable').forEach(function(c) {
    if (c.innerText) data[c.dataset.key] = c.innerText;
  });
  movedSeats = data;

  google.script.run
    .withSuccessHandler(function(msg) {
      alert(msg);
      App.updateVersion();
      App.hideLoading();
    })
    .saveMovedSeats(data);
}

function reset() {
  if (!confirm('이동 자리 배치를 모두 삭제하시겠습니까?')) return;
  App.showLoading('초기화 중...');

  google.script.run
    .withSuccessHandler(function(msg) {
      alert(msg);
      movedSeats = {};
      render();
      App.hideLoading();
    })
    .resetMovedSeats();
}

function refresh() {
  App.hideAlert();
  load();
}

function load() {
  App.showLoading('불러오는 중...');

  // 원본 레이아웃 로드
  google.script.run
    .withSuccessHandler(function(originalConfig) {
      layouts.original = originalConfig || { rows: 11, aisles: [], pillars: [] };

      // 이동 레이아웃 로드
      google.script.run
        .withSuccessHandler(function(movedConfig) {
          layouts.moved = movedConfig || { rows: 11, aisles: [], pillars: [] };

          // 이동 좌석 배치 로드
          google.script.run
            .withSuccessHandler(function(seats) {
              movedSeats = seats || {};
              try {
                render();
              } catch (e) {
                console.error('렌더링 오류:', e);
              }
              App.updateVersion();
              App.hideLoading();
            })
            .withFailureHandler(function(e) {
              console.error('좌석 로드 실패:', e);
              try { render(); } catch (err) { console.error('렌더링 오류:', err); }
              App.hideLoading();
            })
            .getMovedSeats();
        })
        .withFailureHandler(function(e) {
          console.error('이동 레이아웃 로드 실패:', e);
          layouts.moved = { rows: 11, aisles: [], pillars: [] };
          try { render(); } catch (err) { console.error('렌더링 오류:', err); }
          App.hideLoading();
        })
        .getLayout('moved');
    })
    .withFailureHandler(function(e) {
      console.error('원본 레이아웃 로드 실패:', e);
      layouts.original = { rows: 11, aisles: [], pillars: [] };
      try { render(); } catch (err) { console.error('렌더링 오류:', err); }
      App.hideLoading();
    })
    .getLayout('original');
}

// 터치 드래그
document.addEventListener('touchmove', function(e) {
  if (Drag.active && currentLayer === 'moved') {
    var t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    if (t && t.classList.contains('cell-selectable')) paint(t);
  }
}, { passive: false });

// 초기화
window.onload = load;
setInterval(function() { App.checkVersion(); }, 15000);
</script>
</body>
</html>
