<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; font-family: sans-serif; touch-action: none; }
        .main-wrapper { display: flex; height: 100vh; width: 100vw; }
        .sidebar-menu { width: 160px; background: #f8f9fa; border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left 0.3s; position: relative; }
        .sidebar-menu.collapsed { margin-left: -160px; }
        .toggle-btn { position: absolute; top: 50%; right: -25px; transform: translateY(-50%); width: 25px; height: 60px; background: #333; color: #fff; border: none; border-radius: 0 5px 5px 0; cursor: pointer; z-index: 100; font-size: 12px; }
        .item-section { flex-grow: 1; overflow-y: auto; padding: 5px; }
        .grade-flex { display: flex; gap: 4px; margin-bottom: 8px; }
        .grade-col { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .label { font-size: 10px; font-weight: bold; text-align: center; color: #666; margin-bottom: 2px; border-bottom: 1px solid #eee; }
        .tag { width: 100%; padding: 6px 0; text-align: center; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; border: 1px solid rgba(0,0,0,0.1); }
        .c-5 { background: #1976d2; } .c-6 { background: #388e3c; } .c-choir { background: #9c27b0; }
        .selected-tag { outline: 3px solid #ffeb3b; transform: scale(1.05); z-index: 10; }
        .footer-btns { display: flex; flex-direction: column; gap: 2px; padding: 5px; }
        .btn { border: none; padding: 10px; cursor: pointer; font-weight: bold; font-size: 11px; color: #fff; border-radius: 4px; }
        .btn-save { background: #28a745; } .btn-reset { background: #dc3545; }
        .grid-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; position: relative; }
        .grid-container { display: grid; grid-template-columns: repeat(34, minmax(0, 1fr)); width: 100%; aspect-ratio: 34 / 11; gap: 1px; }
        .cell { border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; background: #fff; min-width: 0; }
        .pillar { background: #444 !important; color: #fff !important; border: none; }
        .aisle { background: #f0f0f0; border: none; }
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; z-index: 2000; display: none; }
        #update-alert { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #000; padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; display: none; z-index: 3000; border: 2px solid #fff; }

        @media (orientation: portrait) {
          .main-wrapper { flex-direction: column; } .sidebar-menu { width: 100%; height: auto; } .sidebar-menu.collapsed { margin-top: -160px; margin-left: 0; }
          .toggle-btn { top: auto; bottom: -25px; right: 10px; width: 50px; height: 25px; border-radius: 0 0 5px 5px; transform: none; }
        }
    </style>
</head>
<body>

<div id="update-alert" onclick="refreshData();">🔔 데이터가 변경되었습니다. (클릭하여 반영)</div>

<div class="main-wrapper">
    <div class="sidebar-menu" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
        <div class="item-section">
            <div class="grade-flex">
                <div class="grade-col">
                    <div class="label">5학년</div>
                    <? if (data.grade5) { for(var i=0; i < data.grade5.length; i++) { ?>
                    <div class="tag c-5" onclick="selectTag(this)"><?= data.grade5[i] ?></div>
                    <? } } ?>
                </div>
                <div class="grade-col">
                    <div class="label">6학년</div>
                    <? if (data.grade6) { for(var j=0; j < data.grade6.length; j++) { ?>
                    <div class="tag c-6" onclick="selectTag(this)"><?= data.grade6[j] ?></div>
                    <? } } ?>
                </div>
            </div>
            <div class="label">성가대</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:3px;">
                <? if (data.choir) { for(var k=0; k < data.choir.length; k++) { ?>
                <div class="tag c-choir" onclick="selectTag(this)"><?= data.choir[k] ?></div>
                <? } } ?>
            </div>
        </div>
        <div class="footer-btns">
            <button class="btn btn-save" onclick="saveData()">배치 저장하기</button>
            <button class="btn btn-reset" onclick="resetAll()">전체 리셋</button>
        </div>
    </div>
    <div class="grid-wrapper">
        <div id="loading">데이터 처리 중...</div>
        <div class="grid-container" id="grid"></div>
    </div>
</div>

<script>
    var layout = [7, '통', 5, '통', 4, '통', 4, '통', 4, '통', 5];
    var selectedName = "", selectedBg = "", selectedText = "", isSwiping = false;
    var myVersion = null;

    function toggleSidebar() {
      var s = document.getElementById('sidebar');
      s.classList.toggle('collapsed');
      document.querySelector('.toggle-btn').innerText = s.classList.contains('collapsed') ? "▶" : "◀";
    }

    function selectTag(el) {
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected-tag'));
      if (selectedName === el.innerText) { selectedName = ""; return; }
      selectedName = el.innerText;
      var s = window.getComputedStyle(el);
      selectedBg = s.backgroundColor; selectedText = s.color;
      el.classList.add('selected-tag');
    }

    function createGrid() {
      var g = document.getElementById('grid');
      g.innerHTML = ''; // 그리드 내부를 완전히 비움
      for (var r = 1; r <= 10; r++) {
        var colCount = 1;
        layout.forEach(item => {
          if (item === '통') {
            var d = document.createElement('div');
            var isP = (colCount === 25 && (r === 5 || r === 6));
            d.className = isP ? 'cell pillar' : 'cell aisle'; d.innerText = isP ? '기' : '';
            g.appendChild(d); colCount++;
          } else {
            for (var i = 0; i < item; i++) {
              var d = document.createElement('div');
              var addr = getLetter(colCount) + r;
              var isP = (colCount >= 9 && colCount <= 13 && (r === 5 || r === 6)) || (colCount === 25 && (r === 5 || r === 6));
              if (isP) { d.className = 'cell pillar'; d.innerText = '기'; }
              else {
                d.className = 'cell seat selectable'; d.dataset.addr = addr;
                d.onmousedown = function(e){ isSwiping = true; process(this); };
                d.onmouseenter = function(e){ if(isSwiping) process(this); };
                d.ontouchstart = function(e){ isSwiping = true; process(this); };
              }
              g.appendChild(d); colCount++;
            }
          }
        });
      }
    }

    function refreshData() {
      document.getElementById('update-alert').style.display = 'none';
      createGrid();
      loadData();
    }

    function loadData() {
      setLoading(true, "데이터 불러오는 중...");
      google.script.run
        .withSuccessHandler(function(map) {
          // 데이터를 채우기 전에 그리드가 비어있다면 생성
          if (!document.querySelector('.selectable')) createGrid();

          if (map) {
            var tags = document.querySelectorAll('.tag');
            var cells = document.querySelectorAll('.selectable');
            cells.forEach(c => {
              var name = map[c.dataset.addr];
              if (name) {
                c.innerText = name;
                for (var t of tags) {
                  if (t.innerText === name) {
                    var s = window.getComputedStyle(t);
                    c.style.backgroundColor = s.backgroundColor; c.style.color = s.color;
                    break;
                  }
                }
              } else {
                c.innerText = "";
                c.style.backgroundColor = "";
              }
            });
          }

          google.script.run.withSuccessHandler(function(v) {
            myVersion = v;
            setLoading(false);
          }).getServerVersion();
        })
        .withFailureHandler(function() {
          setLoading(false);
        })
        .getCurrentSeatData();
    }

    function saveData() {
      setLoading(true, "저장 중...");
      var payload = {};
      document.querySelectorAll('.selectable').forEach(c => {
        if (c.innerText) { payload[c.dataset.addr] = c.innerText; }
      });
      google.script.run.withSuccessHandler(function(msg) {
        alert(msg);
        google.script.run.withSuccessHandler(v => myVersion = v).getServerVersion();
        setLoading(false);
      }).saveAllSeatData(payload);
    }

    function checkUpdate() {
      if (isSwiping || document.getElementById('loading').style.display === 'flex' || myVersion === null) return;
      google.script.run.withSuccessHandler(function(v) {
        if (v !== myVersion && myVersion !== null) document.getElementById('update-alert').style.display = 'block';
      }).getServerVersion();
    }

    function process(c) {
      if (selectedName !== "") {
        c.innerText = selectedName; c.style.backgroundColor = selectedBg; c.style.color = selectedText;
      } else {
        c.innerText = "";
        c.style.backgroundColor = "";
      }
    }

    function setLoading(show, text) {
      var loader = document.getElementById('loading');
      if (text) loader.innerText = text;
      loader.style.display = show ? 'flex' : 'none';
    }

    // 전체 리셋 로직 수정: 새로고침 대신 그리드 재설정 및 데이터 로드
    function resetAll() {
      if (confirm("정말로 모든 데이터를 삭제하시겠습니까?")) {
        setLoading(true, "초기화 중...");
        google.script.run.withSuccessHandler(function(msg) {
          alert(msg);
          createGrid(); // 그리드 구조 다시 생성
          loadData();   // 빈 데이터 상태로 다시 동기화
        }).resetAll();
      }
    }

    function getLetter(col) {
      var l = '', t;
      while (col > 0) { t = (col - 1) % 26; l = String.fromCharCode(65 + t) + l; col = (col - t - 1) / 26; }
      return l;
    }

    // 초기 실행
    createGrid();
    window.onload = loadData;
    setInterval(checkUpdate, 15000);

    document.addEventListener('mouseup', () => isSwiping = false);
    document.addEventListener('touchend', () => isSwiping = false);
    document.addEventListener('touchmove', (e) => {
      if (isSwiping) {
        var t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        if (t && t.classList.contains('selectable')) process(t);
      }
    }, { passive: false });
</script>
</body>
</html>
