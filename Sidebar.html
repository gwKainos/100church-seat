<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <?!= include('Styles'); ?>
  <style>
    body { overflow: hidden; touch-action: none; }
    .wrapper { display: flex; height: 100vh; }

    /* 사이드바 */
    .sidebar {
      width: 150px; background: #f8f9fa; border-right: 1px solid #ddd;
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: margin-left 0.3s; position: relative;
    }
    .sidebar.collapsed { margin-left: -150px; }
    .sidebar-toggle {
      position: absolute; top: 8px; right: -24px;
      width: 24px; height: 40px; background: #333; color: #fff;
      border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 11px;
    }
    .sidebar-header { padding: 8px; border-bottom: 1px solid #ddd; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-footer { padding: 8px; display: flex; flex-direction: column; gap: 4px; }

    .layer-tabs { display: flex; gap: 4px; }
    .layer-tab {
      flex: 1; padding: 8px 4px; text-align: center; border: none; border-radius: 4px;
      cursor: pointer; font-size: 11px; font-weight: 600; background: #e9ecef; color: #495057;
    }
    .layer-tab.active[data-layer="moved"] { background: #007bff; color: #fff; }
    .layer-tab.active[data-layer="original"] { background: #28a745; color: #fff; }

    .grade-row { display: flex; gap: 4px; margin-bottom: 8px; }
    .grade-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .choir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    /* 메인 영역 */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .grid-area {
      flex: 1; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
      padding: 8px;
    }
    .grid-wrapper {
      transform-origin: center center;
    }
    .grid { display: grid; gap: 1px; }
    .grid .cell { display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; border-radius: 1px; }

    @media (orientation: portrait) {
      .wrapper { flex-direction: column; }
      .sidebar {
        width: 100%; height: auto; max-height: 45vh;
        flex-direction: column; border-right: none; border-bottom: 1px solid #ddd;
      }
      .sidebar.collapsed { margin-left: 0; margin-top: -40vh; }
      .sidebar-toggle {
        top: auto; bottom: -24px; left: 8px; right: auto;
        width: 48px; height: 24px; border-radius: 0 0 4px 4px; transform: none;
      }
      .grade-row { flex-direction: row; }
    }
  </style>
</head>
<body>

<div id="loading" class="loading-overlay">불러오는 중...</div>
<div id="alert" class="alert-banner" onclick="refresh()">데이터가 변경되었습니다 (클릭)</div>

<div class="wrapper">
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
    <div class="sidebar-header">
      <div class="layer-tabs">
        <button class="layer-tab active" data-layer="moved" onclick="switchLayer('moved')">이동</button>
        <button class="layer-tab" data-layer="original" onclick="switchLayer('original')">원본</button>
      </div>
    </div>
    <div class="sidebar-content">
      <div class="grade-row">
        <div class="grade-col">
          <div class="label">5학년</div>
          <? var classes = getClassData(); ?>
          <? for (var i = 0; i < classes.grade5.length; i++) { ?>
          <div class="tag tag-5-<?= i + 1 ?>" onclick="selectTag(this)"><?= classes.grade5[i] ?></div>
          <? } ?>
        </div>
        <div class="grade-col">
          <div class="label">6학년</div>
          <? for (var j = 0; j < classes.grade6.length; j++) { ?>
          <div class="tag tag-6-<?= j + 1 ?>" onclick="selectTag(this)"><?= classes.grade6[j] ?></div>
          <? } ?>
        </div>
      </div>
      <div class="label">성가대</div>
      <div class="choir-grid">
        <? for (var k = 0; k < classes.choir.length; k++) { ?>
        <div class="tag tag-choir-<?= classes.choir[k].code ?>" data-code="<?= classes.choir[k].code ?>" onclick="selectTag(this)"><?= classes.choir[k].name ?></div>
        <? } ?>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-success" onclick="save()">저장</button>
      <button class="btn btn-danger" onclick="reset()">리셋</button>
      <button class="btn btn-secondary" onclick="App.goTo('admin')">관리자</button>
    </div>
  </div>

  <div class="main">
    <div class="grid-area" id="gridArea">
      <div class="grid-wrapper" id="gridWrapper">
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>
</div>

<?!= include('Utils'); ?>
<script>
  var ROWS = 15, COLS = 32;
  var currentLayer = 'moved';
  var layouts = {};
  var movedSeats = {};
  var selected = { name: '', bg: '', color: '' };
  var cellSize = 20;

  function toggleSidebar() {
    var s = document.getElementById('sidebar');
    s.classList.toggle('collapsed');
    document.querySelector('.sidebar-toggle').innerText = s.classList.contains('collapsed') ? '▶' : '◀';
    setTimeout(resizeGrid, 350);
  }

  function selectTag(el) {
    if (currentLayer === 'original') return;
    document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('selected'); });

    var code = el.dataset.code || el.innerText;
    if (selected.name === code) {
      selected = { name: '', bg: '', color: '' };
      return;
    }

    var style = getComputedStyle(el);
    selected = { name: code, bg: style.backgroundColor, color: style.color };
    el.classList.add('selected');
  }

  function switchLayer(layer) {
    currentLayer = layer;
    document.querySelectorAll('.layer-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelector('.layer-tab[data-layer="' + layer + '"]').classList.add('active');
    selected = { name: '', bg: '', color: '' };
    document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('selected'); });
    render();
  }

  function resizeGrid() {
    var area = document.getElementById('gridArea');
    var availWidth = area.clientWidth - 16;
    var availHeight = area.clientHeight - 16;

    var cellW = Math.floor(availWidth / COLS);
    var cellH = Math.floor(availHeight / ROWS);
    cellSize = Math.max(12, Math.min(cellW, cellH, 30));

    var fontSize = Math.max(6, Math.floor(cellSize * 0.4));

    var g = document.getElementById('grid');
    g.style.gridTemplateColumns = 'repeat(' + COLS + ', ' + cellSize + 'px)';

    document.querySelectorAll('.grid .cell').forEach(function(cell) {
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = fontSize + 'px';
    });
  }

  function render() {
    var g = document.getElementById('grid');
    g.innerHTML = '';

    var config = layouts[currentLayer] || { rows: ROWS, aisles: [], pillars: [] };

    var aisles = new Set();
    (config.aisles || []).forEach(function(p) {
      if (Array.isArray(p)) {
        aisles.add(p[0] + '_' + p[1]);
      } else {
        for (var r = 1; r <= ROWS; r++) {
          aisles.add(r + '_' + p);
        }
      }
    });

    var pillars = new Set((config.pillars || []).map(function(p) { return p[0] + '_' + p[1]; }));
    var pulpits = new Set((config.pulpits || []).map(function(p) { return p[0] + '_' + p[1]; }));
    var stands = new Set((config.stands || []).map(function(p) { return p[0] + '_' + p[1]; }));
    var tvs = new Set((config.tvs || []).map(function(p) { return p[0] + '_' + p[1]; }));
    var mics = new Set((config.mics || []).map(function(p) { return p[0] + '_' + p[1]; }));
    var pianos = new Set((config.pianos || []).map(function(p) { return p[0] + '_' + p[1]; }));

    for (var r = 1; r <= ROWS; r++) {
      for (var c = 1; c <= COLS; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var key = r + '_' + c;

        if (aisles.has(key)) {
          cell.classList.add('cell-aisle');
        } else if (pillars.has(key)) {
          cell.classList.add('cell-pillar');
          cell.innerText = '기';
        } else if (pulpits.has(key)) {
          cell.classList.add('cell-pulpit');
          cell.innerText = '강';
        } else if (stands.has(key)) {
          cell.classList.add('cell-stand');
          cell.innerText = '보';
        } else if (tvs.has(key)) {
          cell.classList.add('cell-tv');
          cell.innerText = 'TV';
        } else if (mics.has(key)) {
          cell.classList.add('cell-mic');
          cell.innerText = '마';
        } else if (pianos.has(key)) {
          cell.classList.add('cell-piano');
          cell.innerText = '피';
        } else {
          cell.dataset.key = key;
          if (currentLayer === 'moved') {
            cell.classList.add('cell-seat', 'cell-selectable');
            cell.onmousedown = function() { Drag.start(); paint(this); };
            cell.onmouseenter = function() { if (Drag.active) paint(this); };
            cell.ontouchstart = function() { Drag.start(); paint(this); };
          } else {
            cell.classList.add('cell-readonly');
          }
        }
        g.appendChild(cell);
      }
    }

    resizeGrid();
    if (currentLayer === 'moved') applySeats();
  }

  function applySeats() {
    var tags = document.querySelectorAll('.tag');
    document.querySelectorAll('.cell-selectable').forEach(function(cell) {
      var name = movedSeats[cell.dataset.key];
      if (name) {
        cell.innerText = name;
        tags.forEach(function(t) {
          var code = t.dataset.code || t.innerText;
          if (code === name) {
            var s = getComputedStyle(t);
            cell.style.backgroundColor = s.backgroundColor;
            cell.style.color = s.color;
          }
        });
      }
    });
  }

  function paint(cell) {
    if (currentLayer !== 'moved') return;
    if (selected.name) {
      cell.innerText = selected.name;
      cell.style.backgroundColor = selected.bg;
      cell.style.color = selected.color;
    } else {
      cell.innerText = '';
      cell.style.backgroundColor = '';
      cell.style.color = '';
    }
  }

  function save() {
    if (currentLayer !== 'moved') {
      alert('이동 자리 탭에서만 저장할 수 있습니다.');
      return;
    }
    App.showLoading('저장 중...');
    var data = {};
    document.querySelectorAll('.cell-selectable').forEach(function(c) {
      if (c.innerText) data[c.dataset.key] = c.innerText;
    });
    movedSeats = data;

    google.script.run
      .withSuccessHandler(function(msg) {
        alert(msg);
        App.updateVersion();
        App.hideLoading();
      })
      .saveMovedSeats(data);
  }

  function reset() {
    if (!confirm('이동 자리 배치를 모두 삭제하시겠습니까?')) return;
    App.showLoading('초기화 중...');

    google.script.run
      .withSuccessHandler(function(msg) {
        alert(msg);
        movedSeats = {};
        render();
        App.hideLoading();
      })
      .resetMovedSeats();
  }

  function refresh() {
    App.hideAlert();
    load();
  }

  function load() {
    App.showLoading('불러오는 중...');

    google.script.run
      .withSuccessHandler(function(originalConfig) {
        layouts.original = originalConfig || { rows: 15, aisles: [], pillars: [] };

        google.script.run
          .withSuccessHandler(function(movedConfig) {
            layouts.moved = movedConfig || { rows: 15, aisles: [], pillars: [] };

            google.script.run
              .withSuccessHandler(function(seats) {
                movedSeats = seats || {};
                try {
                  render();
                } catch (e) {
                  console.error('렌더링 오류:', e);
                }
                App.updateVersion();
                App.hideLoading();
              })
              .withFailureHandler(function(e) {
                console.error('좌석 로드 실패:', e);
                try { render(); } catch (err) { console.error('렌더링 오류:', err); }
                App.hideLoading();
              })
              .getMovedSeats();
          })
          .withFailureHandler(function(e) {
            console.error('이동 레이아웃 로드 실패:', e);
            layouts.moved = { rows: 15, aisles: [], pillars: [] };
            try { render(); } catch (err) { console.error('렌더링 오류:', err); }
            App.hideLoading();
          })
          .getLayout('moved');
      })
      .withFailureHandler(function(e) {
        console.error('원본 레이아웃 로드 실패:', e);
        layouts.original = { rows: 15, aisles: [], pillars: [] };
        try { render(); } catch (err) { console.error('렌더링 오류:', err); }
        App.hideLoading();
      })
      .getLayout('original');
  }

  // 터치 드래그
  document.addEventListener('touchmove', function(e) {
    if (Drag.active && currentLayer === 'moved') {
      var t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      if (t && t.classList.contains('cell-selectable')) paint(t);
    }
  }, { passive: false });

  // 화면 크기 변경 시 그리드 리사이즈
  window.addEventListener('resize', function() {
    setTimeout(resizeGrid, 100);
  });

  window.addEventListener('orientationchange', function() {
    setTimeout(resizeGrid, 300);
  });

  window.onload = load;
  setInterval(function() { App.checkVersion(); }, 15000);
</script>
</body>
</html>
