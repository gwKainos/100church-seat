<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <?!= include('Styles'); ?>
  <style>
    body { overflow: hidden; touch-action: none; }
    .wrapper { display: flex; height: 100vh; }

    /* 사이드바 */
    .sidebar {
      width: 160px; background: #f8f9fa; border-right: 1px solid #ddd;
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: margin-left 0.3s; position: relative;
    }
    .sidebar.collapsed { margin-left: -160px; }
    .sidebar-toggle {
      position: absolute; top: 8px; right: -24px;
      width: 24px; height: 40px; background: #333; color: #fff;
      border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 11px;
    }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-footer { padding: 8px; display: flex; flex-direction: column; gap: 4px; }

    .sidebar-header { padding: 8px; border-bottom: 1px solid #ddd; }
    .layer-tabs { display: flex; gap: 4px; }
    .layer-tab {
      flex: 1; padding: 8px 4px; text-align: center; border: none; border-radius: 4px;
      cursor: pointer; font-size: 11px; font-weight: 600; background: #e9ecef; color: #495057;
    }
    .layer-tab.active[data-layer="moved"] { background: #007bff; color: #fff; }
    .layer-tab.active[data-layer="original"] { background: #28a745; color: #fff; }

    .tool-section { margin-bottom: 12px; }
    .tool-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .tool { padding: 8px 4px; text-align: center; font-size: 11px; }

    .student-section { margin-top: 8px; }
    .student-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; max-height: 300px; overflow-y: auto; }
    .student {
      padding: 6px 2px; text-align: center; font-size: 10px; font-weight: 600;
      background: #e8f5e9; border: 2px solid #c8e6c9; border-radius: 3px; cursor: pointer;
    }
    .student:hover { background: #c8e6c9; }
    .student.active { border-color: #007bff; background: #c8e6c9; }

    /* 메인 영역 */
    .main { flex: 1; display: flex; flex-direction: column; padding: 8px; overflow: hidden; }
    .grid-area { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: flex-start; padding-top: 8px; }
    .grid { display: grid; gap: 2px; width: fit-content; }
    .grid .cell { width: 36px; height: 36px; cursor: pointer; font-size: 10px; }
    .col-header, .row-header { background: #f0f0f0; color: #888; font-size: 10px; cursor: default; }

    @media (max-width: 1200px) {
      .grid .cell { width: 30px; height: 30px; font-size: 9px; }
      .col-header, .row-header { font-size: 9px; }
    }

    @media (max-width: 900px) {
      .grid .cell { width: 26px; height: 26px; font-size: 8px; }
      .col-header, .row-header { font-size: 8px; }
    }

    .info { font-size: 11px; color: #888; padding: 4px 0; }

    @media (orientation: portrait) {
      .wrapper { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; height: auto; border-right: none; border-bottom: 1px solid #ddd; }
      .sidebar.collapsed { margin-left: 0; margin-top: -100px; }
      .sidebar-toggle { top: auto; bottom: -24px; left: 8px; right: auto; width: 48px; height: 24px; border-radius: 0 0 4px 4px; transform: none; }
      .sidebar-content { flex-direction: row; align-items: center; }
      .tool-section { margin-bottom: 0; margin-right: 12px; }
      .tool-list { flex-direction: row; }
    }
  </style>
</head>
<body>

<div id="loading" class="loading-overlay">불러오는 중...</div>

<div class="wrapper">
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
    <div class="sidebar-header">
      <div class="layer-tabs">
        <button class="layer-tab active" data-layer="moved" onclick="switchLayer('moved')">이동</button>
        <button class="layer-tab" data-layer="original" onclick="switchLayer('original')">원본</button>
      </div>
    </div>
    <div class="sidebar-content">
      <div class="tool-section">
        <div class="label">도구</div>
        <div class="tool-list">
          <div class="tool active" data-type="seat" onclick="selectTool('seat')">좌석</div>
          <div class="tool" data-type="aisle" onclick="selectTool('aisle')">통로</div>
          <div class="tool" data-type="pillar" onclick="selectTool('pillar')">기둥</div>
          <div class="tool" data-type="pulpit" onclick="selectTool('pulpit')">강대상</div>
          <div class="tool" data-type="stand" onclick="selectTool('stand')">보면대</div>
          <div class="tool" data-type="tv" onclick="selectTool('tv')">TV</div>
          <div class="tool" data-type="mic" onclick="selectTool('mic')">마이크</div>
          <div class="tool" data-type="piano" onclick="selectTool('piano')">피아노</div>
        </div>
      </div>
      <div class="student-section">
        <div class="label">성가대 (고정석)</div>
        <div class="student-grid" id="studentGrid"></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-success" onclick="save()">저장</button>
      <button class="btn btn-secondary" onclick="App.goTo()">돌아가기</button>
    </div>
  </div>

  <div class="main">
    <div class="grid-area">
      <div class="grid" id="grid"></div>
    </div>
    <div class="info">클릭/드래그로 셀 타입 변경</div>
  </div>
</div>

<?!= include('Utils'); ?>
<script>
  var ROWS = 15, COLS = 32;
  var currentLayer = 'moved';
  var currentTool = 'seat';
  var currentStudent = '';
  var gridData = {}; // { original: 2D array, moved: 2D array }

  // 성가대 학생 명단
  var CHOIR_STUDENTS = [
    '유주', '하린', '해나', '소윤', '지우', '희서', '세은', '아인', '소유', '지윤',
    '시아', '하민', '다현', '민아', '서인', '서아', '예온', '나윤', '하진', '선우',
    '상준', '은재', '연우', '솔', '현지', '서율', '담', '하루', '은유', '서현',
    '건', '윤', '예원', '주혜', '희우', '성준', '노아'
  ];

  function toggleSidebar() {
    var s = document.getElementById('sidebar');
    s.classList.toggle('collapsed');
    document.querySelector('.sidebar-toggle').innerText = s.classList.contains('collapsed') ? '▶' : '◀';
  }

  function initGridData() {
    var arr = [];
    for (var r = 0; r < ROWS; r++) {
      arr[r] = [];
      for (var c = 0; c < COLS; c++) arr[r][c] = 'seat';
    }
    return arr;
  }

  function switchLayer(layer) {
    currentLayer = layer;
    document.querySelectorAll('.layer-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelector('.layer-tab[data-layer="' + layer + '"]').classList.add('active');
    renderGrid();
  }

  function selectTool(type) {
    currentTool = type;
    currentStudent = '';
    document.querySelectorAll('.tool').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.student').forEach(function(s) { s.classList.remove('active'); });
    document.querySelector('.tool[data-type="' + type + '"]').classList.add('active');
  }

  function selectStudent(name, el) {
    currentStudent = name;
    currentTool = '';
    document.querySelectorAll('.tool').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.student').forEach(function(s) { s.classList.remove('active'); });
    el.classList.add('active');
  }

  function renderStudentGrid() {
    var grid = document.getElementById('studentGrid');
    grid.innerHTML = '';
    CHOIR_STUDENTS.forEach(function(name) {
      var el = document.createElement('div');
      el.className = 'student';
      el.innerText = name;
      el.onclick = function() { selectStudent(name, el); };
      grid.appendChild(el);
    });
  }

  function createGrid() {
    var g = document.getElementById('grid');
    g.innerHTML = '';
    var cellSize = window.innerWidth > 1200 ? 36 : (window.innerWidth > 900 ? 30 : 26);
    var headerSize = cellSize + 2;
    g.style.gridTemplateColumns = headerSize + 'px repeat(' + COLS + ', ' + cellSize + 'px)';

    // 헤더 행
    g.appendChild(createCell('', 'col-header'));
    for (var c = 1; c <= COLS; c++) {
      g.appendChild(createCell(c, 'col-header'));
    }

    // 데이터 행
    for (var r = 1; r <= ROWS; r++) {
      g.appendChild(createCell(r, 'row-header'));
      for (var c = 1; c <= COLS; c++) {
        var cell = createCell('', 'cell-seat');
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.onmousedown = function() { Drag.start(); applyTool(this); };
        cell.onmouseenter = function() { if (Drag.active) applyTool(this); };
        g.appendChild(cell);
      }
    }
  }

  function createCell(text, className) {
    var d = document.createElement('div');
    d.className = 'cell ' + className;
    d.innerText = text;
    return d;
  }

  function applyTool(cell) {
    var r = parseInt(cell.dataset.row) - 1;
    var c = parseInt(cell.dataset.col) - 1;
    if (currentStudent) {
      gridData[currentLayer][r][c] = 'student:' + currentStudent;
      updateCellStyle(cell, 'student:' + currentStudent);
    } else if (currentTool) {
      gridData[currentLayer][r][c] = currentTool;
      updateCellStyle(cell, currentTool);
    }
  }

  function updateCellStyle(cell, type) {
    cell.className = 'cell';
    cell.innerText = '';
    if (type.indexOf('student:') === 0) {
      var name = type.substring(8);
      cell.classList.add('cell-student');
      cell.innerText = name;
    } else if (type === 'seat') cell.classList.add('cell-seat');
    else if (type === 'aisle') cell.classList.add('cell-aisle');
    else if (type === 'pillar') { cell.classList.add('cell-pillar'); cell.innerText = '기'; }
    else if (type === 'pulpit') { cell.classList.add('cell-pulpit'); cell.innerText = '강'; }
    else if (type === 'stand') { cell.classList.add('cell-stand'); cell.innerText = '보'; }
    else if (type === 'tv') { cell.classList.add('cell-tv'); cell.innerText = 'TV'; }
    else if (type === 'mic') { cell.classList.add('cell-mic'); cell.innerText = '마'; }
    else if (type === 'piano') { cell.classList.add('cell-piano'); cell.innerText = '피'; }
  }

  function renderGrid() {
    var data = gridData[currentLayer];
    document.querySelectorAll('.cell[data-row]').forEach(function(cell) {
      var r = parseInt(cell.dataset.row) - 1;
      var c = parseInt(cell.dataset.col) - 1;
      updateCellStyle(cell, data[r][c]);
    });
  }

  function applyConfigToGrid(config, layer) {
    var data = gridData[layer];

    // 초기화
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) data[r][c] = 'seat';
    }

    // 통로 적용 (개별 셀 [행, 열] 형식)
    (config.aisles || []).forEach(function(p) {
      if (Array.isArray(p)) {
        var pr = p[0] - 1, pc = p[1] - 1;
        if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'aisle';
      } else {
        for (var r = 0; r < ROWS; r++) {
          if (p > 0 && p <= COLS) data[r][p - 1] = 'aisle';
        }
      }
    });

    // 기둥 적용
    (config.pillars || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'pillar';
    });

    // 강대상 적용
    (config.pulpits || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'pulpit';
    });

    // 보면대 적용
    (config.stands || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'stand';
    });

    // TV 적용
    (config.tvs || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'tv';
    });

    // 마이크 적용
    (config.mics || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'mic';
    });

    // 피아노 적용
    (config.pianos || []).forEach(function(p) {
      var pr = p[0] - 1, pc = p[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'piano';
    });

    // 학생 적용
    (config.students || []).forEach(function(s) {
      var pr = s.pos[0] - 1, pc = s.pos[1] - 1;
      if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) data[pr][pc] = 'student:' + s.name;
    });
  }

  function load() {
    App.showLoading('불러오는 중...');

    gridData.original = initGridData();
    gridData.moved = initGridData();

    google.script.run
      .withSuccessHandler(function(originalConfig) {
        applyConfigToGrid(originalConfig, 'original');

        google.script.run
          .withSuccessHandler(function(movedConfig) {
            try {
              applyConfigToGrid(movedConfig, 'moved');
              renderGrid();
            } catch (e) {
              console.error('그리드 렌더링 오류:', e);
            }
            App.hideLoading();
          })
          .withFailureHandler(function(e) {
            console.error('이동 레이아웃 로드 실패:', e);
            try { renderGrid(); } catch (err) { console.error('렌더링 오류:', err); }
            App.hideLoading();
          })
          .getLayout('moved');
      })
      .withFailureHandler(function(e) {
        console.error('원본 레이아웃 로드 실패:', e);
        try { renderGrid(); } catch (err) { console.error('렌더링 오류:', err); }
        App.hideLoading();
      })
      .getLayout('original');
  }

  function save() {
    App.showLoading('저장 중...');

    var data = gridData[currentLayer];

    var aisles = [], pillars = [], pulpits = [], stands = [], tvs = [], mics = [], pianos = [], students = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var type = data[r][c];
        var pos = [r + 1, c + 1];
        if (type === 'aisle') aisles.push(pos);
        else if (type === 'pillar') pillars.push(pos);
        else if (type === 'pulpit') pulpits.push(pos);
        else if (type === 'stand') stands.push(pos);
        else if (type === 'tv') tvs.push(pos);
        else if (type === 'mic') mics.push(pos);
        else if (type === 'piano') pianos.push(pos);
        else if (type.indexOf('student:') === 0) {
          students.push({ pos: pos, name: type.substring(8) });
        }
      }
    }

    var config = { rows: ROWS, aisles: aisles, pillars: pillars, pulpits: pulpits, stands: stands, tvs: tvs, mics: mics, pianos: pianos, students: students };

    google.script.run
      .withSuccessHandler(function(msg) {
        alert(msg);
        App.hideLoading();
      })
      .withFailureHandler(function(e) {
        alert('저장 실패: ' + e);
        App.hideLoading();
      })
      .saveLayout(currentLayer, config);
  }

  createGrid();
  renderStudentGrid();
  window.onload = load;

  window.addEventListener('resize', function() {
    createGrid();
    renderGrid();
  });
</script>
</body>
</html>
